# Po každém pushi do main se web sestaví a nasadí na Firebase Hosting (včetně firestore.rules).
# Potřebuje v GitHubu (Settings → Secrets and variables → Actions):
#   - (volitelně) proměnnou FIREBASE_PROJECT_ID, výchozí je mobil-majak
#   - secret     FIREBASE_SERVICE_ACCOUNT  = JSON klíč servisního účtu (role „Firebase Admin“)
# Postup je v README v sekci Nasazení.
name: Nasazení na Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - if: env.HAS_KEY != 'true'
        run: echo "::warning::Chybí secret FIREBASE_SERVICE_ACCOUNT – nasazení se přeskakuje (viz README)."
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - if: env.HAS_KEY == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Nasazení webu (Hosting)
        if: env.HAS_KEY == 'true'
        run: npx --yes firebase-tools@15 deploy --only hosting --project "${{ vars.FIREBASE_PROJECT_ID || 'mobil-majak' }}" --non-interactive
      # Pravidla databáze: servisní účet potřebuje navíc roli „Service Usage Consumer“ (viz README).
      # Když ji nemá, web se přesto nasadí a pravidla lze vložit ručně v konzoli.
      - name: Nasazení pravidel databáze (firestore.rules)
        if: env.HAS_KEY == 'true'
        continue-on-error: true
        run: npx --yes firebase-tools@15 deploy --only firestore:rules --project "${{ vars.FIREBASE_PROJECT_ID || 'mobil-majak' }}" --non-interactive
